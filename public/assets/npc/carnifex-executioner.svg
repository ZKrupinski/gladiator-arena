 <linearGradient id="hood" x1=".2" x2=".85" y1=".1" y2=".98"><stop stop-color="#473b35"/><stop offset=".38" stop-color="#18181b"/><stop offset=".75" stop-color="#2f1b1c"/><stop offset="1" stop-color="#130d11"/></linearGradient>
