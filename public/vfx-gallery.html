<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GLADIATOR · 이펙트 프레임 검수</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#10151d;color:#eee5d7}*{box-sizing:border-box}
body{margin:0}header,main{max-width:1440px;margin:auto;padding:24px}h1{font-size:28px;color:#f2cc86}
p{color:#bcc5d1;line-height:1.7}a{color:#f2cc86}nav{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
button,select{padding:10px;background:#283345;color:#fff;border:1px solid #65778c;border-radius:6px;cursor:pointer}
main{display:grid;grid-template-columns:repeat(auto-fit,minmax(350px,1fr));gap:24px}
article{background:#18212e;padding:16px;border:1px solid #36465a;border-radius:12px;min-width:0}
h2{font-size:18px;margin:0 0 8px}canvas{width:100%;aspect-ratio:1;display:block;background-color:#171e29}
.checker canvas{background-image:conic-gradient(#2c3644 25%,#1c2531 0 50%,#2c3644 0 75%,#1c2531 0);background-size:28px 28px}
.strip{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;margin:12px 0}
.strip button{padding:0;position:relative;background:#101823}.strip img{width:100%;display:block}
.strip span{font-size:10px}.status{font:12px monospace;color:#9cc7b0;min-height:20px}
label{white-space:nowrap}input{vertical-align:middle}.selected{outline:2px solid #efc579}
</style>
<script src="arena-raster-vfx.js?v=4-isolated"></script>
<header><a href="./">← 경기장으로</a><h1>전투 이펙트 · 프레임 커팅 검수</h1>
<p>10종 × 8프레임 · 개별 투명 PNG 512 × 512. 게임과 동일한 이미지·재생기를 사용합니다.<br>
각 프레임은 공통 기준점을 유지하며 최소 23px의 투명 여백을 갖습니다. 아래 번호를 누르면 해당 프레임에서 멈춥니다.</p>
<nav><button id="play">일시정지</button><button id="prev">이전 프레임</button><button id="next">다음 프레임</button>
<label>방향 <select id="face"><option value="1">오른쪽 →</option><option value="-1">← 왼쪽</option></select></label>
<label>속도 <select id="speed"><option value=".25">25%</option><option value=".5" selected>50%</option><option value="1">100%</option></select></label>
<label><input type="checkbox" id="bounds" checked>프레임 경계</label>
<label><input type="checkbox" id="checker" checked>투명 배경</label>
<label>프레임 <input id="frame" type="range" min="0" max="7" value="0"><output id="counter">1 / 8</output></label></nav>
<p id="load" role="status">프레임을 불러오는 중…</p></header><main id="gallery" class="checker"></main>
<script>
const fx=window.ArenaRasterFX;
const names={slash:'종베기 · 금빛 상승 검광',sweep:'횡베기 · 은금빛 수평 검광',thrust:'찌르기 · 청백색 직선 검광',
hit:'타격 · 전방 금속 파편',guard:'방어 · 청백색 반달 충격',parry:'패링 · 은백색 반격 섬광',
finisher:'피니시 · 붉은 상승 반격',dash:'대시 강공격 · 전방 쐐기 검광',special:'특수 공격 · 청록 나선',victory:'승리 · 방향성 후광과 꽃잎'};
let paused=false,chosen=0,playTime=0,last=0,face=1,speed=.5;
const cards=Object.entries(names).map(([kind,title])=>{
 const el=document.createElement('article'),h=document.createElement('h2');h.textContent=title;el.append(h);
 const canvas=document.createElement('canvas');canvas.width=canvas.height=640;el.append(canvas);
 const status=document.createElement('div');status.className='status';el.append(status);
 const strip=document.createElement('div');strip.className='strip';
 for(let i=0;i<8;i++){const b=document.createElement('button'),im=document.createElement('img'),n=document.createElement('span');
  im.src='assets/new-era/directional-v4/'+kind+'-'+String(i).padStart(2,'0')+'.png?v=4';im.alt=title+' '+(i+1)+'프레임';
  n.textContent=String(i+1);b.append(im,n);b.title=(i+1)+'프레임 보기';b.onclick=()=>seek(i);strip.append(b);}
 el.append(strip);const a=document.createElement('a');a.href='assets/new-era/directional-v4/'+kind+'-sheet.png';a.textContent='투명 PNG 시트 열기';a.target='_blank';el.append(a);
 document.querySelector('#gallery').append(el);return {kind,canvas,ctx:canvas.getContext('2d'),status,strip};
});
function seek(i){paused=true;chosen=(i+8)%8;document.querySelector('#play').textContent='재생';}
document.querySelector('#play').onclick=e=>{paused=!paused;e.target.textContent=paused?'재생':'일시정지';playTime=chosen/8;};
document.querySelector('#prev').onclick=()=>seek(chosen-1);
document.querySelector('#next').onclick=()=>seek(chosen+1);
document.querySelector('#frame').oninput=e=>seek(Number(e.target.value));
document.querySelector('#face').onchange=e=>face=Number(e.target.value);
document.querySelector('#speed').onchange=e=>speed=Number(e.target.value);
document.querySelector('#checker').onchange=e=>document.querySelector('#gallery').classList.toggle('checker',e.target.checked);
function draw(ms){
 const dt=Math.min(.06,(ms-last)/1000||0);last=ms;if(!paused)playTime+=dt*speed;
 chosen=paused?chosen:Math.floor((playTime%1)*8);
 document.querySelector('#frame').value=chosen;document.querySelector('#counter').textContent=(chosen+1)+' / 8';
 let loaded=0;
 for(const c of cards){const {ctx,kind}=c;ctx.clearRect(0,0,640,640);
  if(fx.ready(kind)){loaded++;fx.draw(ctx,kind,320,320,512,512,(chosen+.5)/8,1,face);
   c.status.textContent='독립 PNG · 프레임 '+(chosen+1)+' / 8 · '+(face>0?'오른쪽':'왼쪽');}
  else c.status.textContent='불러오는 중…';
  if(document.querySelector('#bounds').checked){ctx.strokeStyle='#88b6ca';ctx.lineWidth=1;ctx.strokeRect(64.5,64.5,511,511);
   ctx.setLineDash([4,5]);ctx.strokeStyle='#e5bf7766';ctx.strokeRect(84.5,84.5,471,471);ctx.setLineDash([]);}
  [...c.strip.children].forEach((b,i)=>b.classList.toggle('selected',i===chosen));
 }
 document.querySelector('#load').textContent=loaded===cards.length?'80 / 80 프레임 준비 완료 · 실선: PNG 경계 / 점선: 20px 안전 여백':loaded+' / '+cards.length+'종 준비됨';
 requestAnimationFrame(draw);
}
if(new URLSearchParams(location.search).has('__arena_qa'))window.__arenaVfxGalleryQA={seek:i=>seek(i),pause:v=>paused=v};
requestAnimationFrame(draw);
</script></html>
