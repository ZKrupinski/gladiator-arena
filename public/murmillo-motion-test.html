<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MURMILLO B · New Keyframes</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif}*{box-sizing:border-box}
body{margin:0;background:#17120e;color:#f0dfbe}main{max-width:1100px;margin:0 auto;padding:18px}
h1{margin:0 0 8px;font-size:clamp(21px,4vw,32px)}
p,small{color:#c5b39c;line-height:1.5}canvas{display:block;width:100%;height:auto;border:1px solid #8b6946;border-radius:12px}
.controls{display:flex;flex-wrap:wrap;gap:7px;margin:13px 0}
button{min-height:46px;padding:9px 13px;color:#eed7b5;background:#30271c;border:1px solid #776045;border-radius:8px;cursor:pointer;font-weight:700}
button.active{background:#977241;color:white;border-color:#f0d49a}
.panel{display:flex;gap:12px 22px;flex-wrap:wrap;align-items:center;margin-top:8px}
a{color:#edd198}#status{display:inline-block;min-width:240px;font-weight:700}
</style></head><body><main>
<h1>무르밀로 · 원본 vs 신규 애니메이션</h1>
<p>왼쪽은 원본 5등급, 오른쪽은 별도 소속 검투사로 추가된 신규 버전입니다. 실제 전투와 동일한 70% 스케일로 두 캐릭터를 비교합니다.</p>
<canvas id="stage" width="1000" height="620" aria-label="검투사 동작 프레임 시연"></canvas>
<div class="controls" id="controls"></div>
<div class="panel"><strong id="status" role="status">원본 전투 프레임 로딩 중…</strong>
<label><input id="auto" type="checkbox" checked> 전체 동작 자동 시연</label>
<button id="flip">좌우 반전</button>
<a href="./">실제 게임 열기 ↗</a></div>
<p><small>왼쪽 기존 무르밀로는 성장 5단계를 유지하며 원본 고정 키포즈를 사용합니다. 오른쪽은 독립 소속 검투사로 실제 경기에서 선택할 수 있습니다. 다른 검투사에는 떨림 프레임을 적용하지 않습니다.</small></p>
</main><script src="growth-frames.js?v=2"></script>
<script src="murmillo-motion-v2.js?v=4"></script>
<script>
(()=>{'use strict';
const c=document.getElementById('stage'),g=c.getContext('2d');
const status=document.getElementById('status'),auto=document.getElementById('auto');
const labels={idle:'기본 대기',walk:'이동',slash:'종베기',sweep:'횡베기',thrust:'찌르기',
 heavy:'강베기',guard:'방어',dodge:'회피',hit:'피격',dash:'4타 돌진',victory:'승리',defeat:'패배'};
const duration={idle:2.8,walk:1.5,slash:.35,sweep:.35,thrust:.35,heavy:.48,guard:.52,dodge:.34,hit:.31,dash:.56,victory:1.9,defeat:1.9};
const names=Object.keys(labels);
const f={cls:'murmillo',action:'idle',actionT:0,actionDuration:1,attackVariant:0,guard:false,dead:false,vx:0,face:1,footworkSeed:0};
const scene={phase:'fight',player:f,resultApplied:false,resultWin:true,resultAnim:0};
let current='idle',start=performance.now(),segment=start,flipped=false,fallback=null,ready=false,ever=false;
function setAction(key,manual=false){
 current=key;start=performance.now();segment=start;
 if(manual)auto.checked=false;
 document.querySelectorAll('[data-motion]').forEach(b=>b.classList.toggle('active',b.dataset.motion===key));
}
for(const [key,name] of Object.entries(labels)){
 const b=document.createElement('button');b.textContent=name;b.dataset.motion=key;
 b.onclick=()=>setAction(key,true);document.getElementById('controls').append(b);
}
document.getElementById('flip').onclick=()=>flipped=!flipped;
auto.onchange=()=>{if(auto.checked)setAction('idle');};
setAction('idle');
function loadFallback(){
 return Promise.all([
 fetch('assets/ludus-growth/frame-cuts.json?v=2').then(r=>{if(!r.ok)throw Error('프레임 마스크 실패');return r.json();}),
 new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src='assets/ludus-growth/murmillo_a_L5.png';})
 ]).then(([cuts,img])=>GrowthFrames.isolate(img,cuts.sheets.murmillo_a_L5));
}
Promise.all([MurmilloMotion.loadAssets(),loadFallback()])
 .then(([asset,atlas])=>{
   fallback=atlas;ready=true;
   status.textContent=(asset?'개별 프레임 준비':'원본 시트 대체 로딩')+' · 비교 재생 중';
 }).catch(e=>status.textContent='이미지 로딩 실패: '+e.message);
function frame(now){
 const t=now/1000;
 if(auto.checked && now-segment>2350){
  const idx=(names.indexOf(current)+1)%names.length;
  setAction(names[idx]);
 }
 const d=duration[current],full=d+.36;
 let elapsed=((now-start)/1000)%full;
 const live=Math.min(elapsed,d),phase=Math.min(1,live/d);
 f.actionT=elapsed<d?Math.max(.00001,d-live):0;
 f.actionDuration=d;f.guard=false;f.vx=0;f.dead=false;
 scene.phase='fight';scene.resultApplied=false;scene.resultAnim=0;
 if(['slash','sweep','thrust'].includes(current)){
   f.action='attack';f.attackVariant=['slash','sweep','thrust'].indexOf(current);
 }else if(current==='heavy')f.action='special';
 else if(current==='dash')f.action='comboDash';
 else if(current==='victory'){
   f.action='idle';f.actionT=0;scene.phase='result';scene.resultApplied=true;
   scene.resultWin=true;scene.resultAnim=2;
 }else if(current==='defeat'){
   f.action='defeat';f.actionT=0;
   scene.phase=elapsed<d?'finisher':'result';
   scene.resultApplied=true;scene.resultWin=false;scene.resultAnim=1.15*phase;
 }else{
   f.action=current;
   if(current==='idle'||current==='walk')f.actionT=0;
   if(current==='walk')f.vx=155;
   if(current==='guard')f.guard=true;
 }
 const grad=g.createLinearGradient(0,0,0,620);
 grad.addColorStop(0,'#443123');grad.addColorStop(.78,'#76573a');grad.addColorStop(1,'#5a3d22');
 g.fillStyle=grad;g.fillRect(0,0,1000,620);
 g.fillStyle='#b08350';g.fillRect(0,570,1000,50);
 g.fillStyle='#e3b984';g.fillRect(0,569,1000,2);
 g.font='bold 26px system-ui';g.fillStyle='#fff3d4';
 g.fillText('MURMILLO · '+labels[current],24,44);
 if(ready){
  // Same combat size for both: 348px arena cell * 0.70 animated fighter scale.
  const combatSize=348*.70;
  const standingY=570-combatSize;
  g.font='bold 21px system-ui';g.fillStyle='#fce5b9';
  g.fillText('기존 무르밀로 · L5',170,190);
  g.fillText('신규 · 애니메이션',570,190);
  GrowthFrames.draw(g,fallback,0,190,standingY,combatSize,combatSize,false,1);
  const worldX=575+(current==='walk'?32*Math.sin(t*2):0);
  const drawn=MurmilloMotion.draw(g,{atlas:fallback,fighter:f,scene,clock:t,
    x:worldX,y:standingY,w:combatSize,h:combatSize,flip:flipped,alpha:1});
  if(drawn){
   const motion=MurmilloMotion.motionAt(f,scene,t);
   g.font='18px system-ui';g.fillStyle='#f9e5ba';
   g.fillText('LIVE · '+motion.action+' · keyframe '+motion.index+' · '+Math.round(phase*100)+'%',24,596);
   if(!ever){ever=true;status.textContent='실시간 루프 재생 중 · '+MurmilloMotion.assetStatus();}
  }else status.textContent='전투 이미지가 그려지지 않습니다.';
 }else{g.font='26px system-ui';g.fillText('이미지 로딩 중…',395,310);}
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script></body></html>
