name: Directional eight-frame gladiator VFX QA
on:
  push:
    branches: [main]
    paths:
      - public/arena-directional-vfx.js
      - public/index.html
      - scripts/qa_directional_vfx_browser.mjs
      - .github/workflows/directional-vfx-qa.yml
  workflow_dispatch:
jobs:
  directional-vfx:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Check eight-frame renderer JavaScript
        run: node --check public/arena-directional-vfx.js
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve actual battle website
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory public >/tmp/directional.log 2>&1 &
          sleep 3
      - name: Verify all 8 frames, 9 types, mirror direction and victory layers
        run: node scripts/qa_directional_vfx_browser.mjs
