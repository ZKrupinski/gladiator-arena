name: Verify real training Doctore replacement
on:
  push:
    branches: [main]
    paths:
      - public/index.html
      - public/ludus-doctore-anim.js
      - public/ludus-training-doctore.css
      - public/ludus-approved-scenes.js
      - public/assets/ludus/doctore-whip-user-v1.png
      - public/assets/ludus/doctore-idle-approved-v1.png
      - public/assets/ludus/doctore-explain-approved-v1.png
      - public/assets/ludus/doctore-authority-approved-v1.png
      - public/assets/ludus/doctore-whip-clean-v2/**
      - scripts/build_doctore_whip_clean.py
      - scripts/qa_user_doctore_browser.mjs
      - .github/workflows/qa-user-doctore-browser.yml
  workflow_dispatch:
jobs:
  actual-training-scene:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install headless browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Host current game
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory public >/tmp/doctore.log 2>&1 &
          sleep 2
      - name: Confirm new original NPC renders and 800px lash remains intact
        run: node scripts/qa_user_doctore_browser.mjs
      - name: Verify Cloudflare serves the same original PNG and updated scripts
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, pathlib, urllib.request, time
          origin='https://gladiator-arena-git.pages.dev'
          names=['doctore-idle-approved-v1.png','doctore-explain-approved-v1.png',
                 'doctore-authority-approved-v1.png','doctore-whip-user-v1.png']
          expected={n:hashlib.sha256(pathlib.Path('public/assets/ludus',n).read_bytes()).hexdigest()
                    for n in names}
          for attempt in range(1,15):
              try:
                  hashes={}
                  for n in names:
                      with urllib.request.urlopen(urllib.request.Request(origin+'/assets/ludus/'+n+'?qa=approved',headers={'User-Agent':'ArenaDoctoreQA'}),timeout=20) as r:
                          hashes[n]=hashlib.sha256(r.read()).hexdigest()
                  with urllib.request.urlopen(urllib.request.Request(origin+'/?doctore-qa='+str(attempt),headers={'User-Agent':'ArenaDoctoreQA','Cache-Control':'no-cache'}),timeout=20) as r:
                      html=r.read().decode('utf-8')
                  with urllib.request.urlopen(urllib.request.Request(origin+'/ludus-doctore-anim.js?v=6',headers={'User-Agent':'ArenaDoctoreQA'}),timeout=20) as r:
                      animation=r.read().decode('utf-8')
                  isolated={}
                  for frame in range(7):
                      name='doctore-whip-clean-v2/frame-'+str(frame)+'.png'
                      with urllib.request.urlopen(urllib.request.Request(origin+'/assets/ludus/'+name+'?qa=clean2',headers={'User-Agent':'ArenaDoctoreQA'}),timeout=20) as r:
                          isolated[frame]=hashlib.sha256(r.read()).hexdigest()
                  local={i:hashlib.sha256(pathlib.Path('public/assets/ludus/doctore-whip-clean-v2/frame-'+str(i)+'.png').read_bytes()).hexdigest() for i in range(7)}
                  if (hashes==expected and isolated==local and
                    'ludus-doctore-anim.js?v=6' in html and
                    'doctore-whip-clean-v2/frame-' in animation and
                    all(n in animation for n in names) and
                    'doctore-sd-v1.webp' not in animation):

                      print('CLOUDFLARE_TRAINER_4_ORIGINAL_PNG_PASS, all image hashes and current JS')
                      break
                  print('Waiting for Cloudflare Git deployment, attempt',attempt,flush=True)
              except Exception as e:
                  print('Waiting for Cloudflare Git deployment',attempt,str(e),flush=True)
              if attempt==14: raise AssertionError('Cloudflare did not serve the new original trainer')
              time.sleep(11)
          PY
