name: Roman result window regression
on:
  push:
    branches: [main]
    paths:
      - public/index.html
      - public/arena-result-roman-v2.css
      - public/assets/new-era/cinematic/roman-result-frame-v2.svg
      - scripts/qa_result_window_browser.mjs
      - .github/workflows/arena-result-window-qa.yml
  workflow_dispatch:
jobs:
  result-window:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory public > /tmp/result-server.log 2>&1 &
          sleep 3
      - name: Verify Roman frame, victory and defeated portraits, viewport fit
        env: {RESULT_PREVIEW: '1'}
        run: node scripts/qa_result_window_browser.mjs
