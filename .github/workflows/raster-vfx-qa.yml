name: Approved PNG eight-frame VFX integration
on:
  push:
    branches: [main]
    paths:
      - public/arena-raster-vfx.js
      - public/index.html
      - public/assets/new-era/cinematic/combat-directional-8f.png
      - public/assets/new-era/cinematic/victory-directional-8f.png
      - scripts/qa_raster_vfx_browser.mjs
      - .github/workflows/raster-vfx-qa.yml
  workflow_dispatch:
jobs:
  raster-vfx:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Confirm original PNG binary size and geometry
        run: |
          python - <<'PY'
          import struct,os
          for f in ['combat','victory']:
           p=f'public/assets/new-era/cinematic/{f}-directional-8f.png'
           with open(p,'rb') as io:
            data=io.read(24)
           assert data[:8]==b'\x89PNG\r\n\x1a\n'
           w,h=struct.unpack('>II',data[16:24])
           assert (w,h)==(1920,960),(p,w,h)
           assert os.stat(p).st_size>500000
          print('APPROVED_ACTUAL_PNG_BINARY_PASS')
          PY
      - name: Check JavaScript syntax
        run: node --check public/arena-raster-vfx.js
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Host real game resources
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory public >/tmp/gladiator-png-qa.log 2>&1 &
          sleep 3
      - name: Verify 16 real PNG frames, directions, separate victory petals and game loading
        run: node scripts/qa_raster_vfx_browser.mjs
