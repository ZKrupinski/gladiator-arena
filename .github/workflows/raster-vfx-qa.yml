name: Isolated directional PNG VFX integration
on:
  push:
    branches: [main]
    paths:
      - public/arena-raster-vfx.js
      - public/index.html
      - public/vfx-gallery.html
      - public/assets/new-era/directional-v4/**
      - scripts/qa_directional*
      - .github/workflows/raster-vfx-qa.yml
  workflow_dispatch:
jobs:
  raster-vfx:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify every source cut and transparent gutter
        run: |
          pip install pillow numpy
          python scripts/qa_directional_frames.py
      - name: Check JavaScript syntax
        run: node --check public/arena-raster-vfx.js
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Host game
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory public >/tmp/vfx.log 2>&1 &
          sleep 3
      - name: Verify all frames, left/right pixels and real combat events
        run: node scripts/qa_directional_vfx.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: directional-vfx-review
          path: docs/vfx-v4/
