name: Build dedicated Murmillo B animation frames
on:
  push:
    branches: [main]
    paths:
      - scripts/build_murmillo_b_frames.py
      - .github/workflows/build-murmillo-b.yml
      - public/assets/combat/murmillo-v2/manifest.json
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet Pillow
      - run: python scripts/build_murmillo_b_frames.py
      - name: Commit key drawings and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/combat/murmillo-b/
          if ! git diff --cached --quiet; then
            git commit -m "assets(murmillo-b): publish separate keyframe drawings for animation"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
