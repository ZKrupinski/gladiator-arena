name: Build clean approved trainer whip frames
on:
  push:
    branches: [main]
    paths:
      - scripts/build_doctore_whip_clean.py
      - .github/workflows/build-doctore-whip-clean.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  separate-lossless-png:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lossless crop dependencies
        run: python -m pip install --quiet pillow numpy scipy
      - name: Isolate exactly seven poses including one wide lash
        run: python scripts/build_doctore_whip_clean.py
      - name: Commit exact-color isolated transparent frames
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/ludus/doctore-whip-clean-v2/
          if git diff --cached --quiet; then
            echo 'Isolated sprites are already checked in'
          else
            git commit -m 'assets(training): add seven isolated lossless whip poses; preserve original'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
