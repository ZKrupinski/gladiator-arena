name: Practice action and VFX studio QA
on:
  push:
    branches: [main]
    paths:
      - public/practice-visual-profiles.js
      - public/practice-scale-profiles.js
      - public/practice-scale-published.js
      - public/tools/practice-scale-calibrator.html
      - public/tools/practice-size-stage.js
      - public/tools/practice-scale-publish.js
      - public/ludus-practice.js
      - public/ludus-training-runtime.js
      - tests/unified-action-scenes-v51.cjs
      - tests/studio-motion-preview-bulk-v53.cjs
      - tests/practice-size-stage-parity-v54.cjs
      - public/index.html
      - tests/practice-visual-authoring-v46.cjs
      - tests/practice-fx-editor-fidelity-v52.cjs
      - tests/practice-motion-timeline-v53.cjs
      - tests/scale-foot-height-v42.cjs
      - tests/scale-publish-status-v40.cjs
      - .github/workflows/qa-practice-visual-editor.yml
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authoring:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: JavaScript parse check
        run: |
          node --check public/practice-visual-profiles.js
          node --check public/practice-scale-profiles.js
          node --check public/tools/practice-size-stage.js
          node --check public/practice-scale-published.js
          node --check public/tools/practice-scale-publish.js
          node --check public/ludus-practice.js
          node --check public/ludus-training-runtime.js
      - name: Shared duel/practice and four-fighter stage sizing
        run: node tests/practice-size-stage-parity-v54.cjs
      - name: Real authoring and effects integration
        run: node tests/practice-visual-authoring-v46.cjs
      - name: Verify editor FX autosave and cross-scene geometry
        run: node tests/practice-fx-editor-fidelity-v52.cjs
      - name: Test animated poses, editor timeline and selective batch copy
        run: node tests/practice-motion-timeline-v53.cjs
      - name: Verify unified cross-scene action profiles and no hidden pose adjustments
        run: node tests/unified-action-scenes-v51.cjs
      - name: Verify 8-frame studio animation, three motion keys and selective batch-copy
        run: node tests/studio-motion-preview-bulk-v53.cjs
      - name: Original Ludus training sprite pose regression
        run: node scripts/qa_training_scale_and_poses.mjs
      - name: Existing persisted foot offset regression
        run: node tests/scale-foot-height-v42.cjs
      - name: GitHub and live deployment-status parser regression
        run: node tests/scale-publish-status-v40.cjs
      - name: Fighter and rival frame-proportion regression
        run: node tests/practice-appearance-proportions-v45.cjs
      - name: Four-fighter lane spacing unchanged
        run: node tests/practice-duel-footwork-v41.cjs
      - name: Carnifex perspective unchanged
        run: node tests/practice-carnifex-scale-v44.cjs
