name: Compose and publish METAL OF ROME sound pack
on:
  push:
    branches: [main]
    paths:
      - scripts/build_rome_audio.py
      - scripts/remaster_rome_audio_real.py
      - .github/workflows/build-rome-audio.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audio-master:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Prepare audio DSP / MP3
        run: |
          python -m pip install --quiet numpy scipy
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
      - name: Replace all synthesized instruments with CC0 brass, real electric guitar and recorded sword hits
        run: python scripts/remaster_rome_audio_real.py
      - name: Validate real encoded sound assets
        run: |
          python - <<'PY'
          import os,json,glob,wave,subprocess
          root="public/assets/audio/rome-v1"
          m=json.load(open(root+"/manifest.json"))
          assert m["version"]==3 and m["license"]=="CC0"
          assert m["ceremony"]["no_trumpet_or_flute"]
          assert m["ceremony"]["no_upbeat_fanfare"]
          for name,duration in [("start_1.wav",2.2),("victory_1.wav",2.65),("defeat_1.wav",2.2)]:
           with wave.open(root+"/"+name) as f:
            assert abs(f.getnframes()/f.getframerate()-duration)<0.015
          assert m["bpm"]==172 and 33<m["durationSeconds"]<34
          for name in m["stems"]+[m["crowd"]]:
           f=root+"/"+name
           assert os.stat(f).st_size>100000,(name,os.stat(f).st_size)
           out=subprocess.check_output(["ffprobe","-v","error","-show_entries","format=duration","-of","default=noprint_wrappers=1:nokey=1",f])
           assert abs(float(out)-m["durationSeconds"])<.15,(name,out)
          for name in sum(m["sfx"].values(),[]):
           with wave.open(root+"/"+name) as wav:
            assert wav.getnframes()>=1000 and wav.getframerate()==32000
          print("LIVE_BRASS_DRY_SWORD_AUDIO_PACK_PASS",m["bpm"],m["durationSeconds"],len(glob.glob(root+"/*.wav")))
          PY
      - name: Publish actual MP3 and WAV content to game main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/audio/rome-v1/
          if ! git diff --cached --quiet; then
            git commit -m "audio(rome v3): replace chirpy start/end fanfares with solemn recorded horn and tuba stingers"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
