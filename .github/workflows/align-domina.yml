name: Align Domina facial animation
on:
  push:
    branches: [main]
    paths:
      - scripts/align_domina_faces.py
      - .github/workflows/align-domina.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  align-face:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install image processing tools
        run: python -m pip install --quiet numpy pillow opencv-python-headless
      - name: Align facial expressions to approved key visual
        run: python scripts/align_domina_faces.py
      - name: Commit animation overlays and alignment QA
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/ludus/domina_face_aligned_*.webp docs/qa/domina-corrected/*.webp
          if ! git diff --cached --quiet; then
            git commit -m "art(ludus): correctly scaled facial animation masks aligned to approved Domina"
            git push origin HEAD:main
          fi
