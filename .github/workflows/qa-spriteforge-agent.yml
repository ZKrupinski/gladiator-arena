name: SpriteForge Agent CLI regression
on:
  push:
    branches: [main]
    paths:
      - scripts/spriteforge_agent.py
      - scripts/test_spriteforge_agent.py
      - .github/workflows/qa-spriteforge-agent.yml
  workflow_dispatch:
jobs:
  autonomous-spriteforge:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pillow numpy scipy
      - name: Run automated acceptance and edge-failure regression
        run: python scripts/test_spriteforge_agent.py
