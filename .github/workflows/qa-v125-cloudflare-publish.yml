name: Verify v125 live gladiator appearance fix
on:
  push:
    branches: [main]
    paths:
      - docs/qa/gladiator-character-identity-v125.md
      - .github/workflows/qa-v125-cloudflare-publish.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cloudflare-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independently verify Cloudflare release marker and actual game file SHA
        run: python scripts/spartacus_uploader.py verify --release-id spartacus-gladiator-visual-identity-v125-20261028 --attempts 20
