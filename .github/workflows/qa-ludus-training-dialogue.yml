name: Validate live training dialogue and clean backdrop
on:
  push:
    branches: [main]
    paths:
      - public/index.html
      - public/ludus-approved-scenes.js
      - public/ludus-training-doctore.css
      - public/ludus-training-clean.css
      - public/ludus-training-runtime.js
      - public/ludus-training-risk.js
      - public/ludus-doctore-anim.js
      - public/assets/ludus/training_blank_v74.webp
      - scripts/qa_ludus_training_dialogue_browser.mjs
      - .github/workflows/qa-ludus-training-dialogue.yml
  workflow_dispatch:
jobs:
  responsive-doctore-dialogue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve the actual deployed build source
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory public >/tmp/ludus-dialogue.log 2>&1 &
          sleep 3
      - name: Click all five training tiles and assert contextual dialogue
        run: node scripts/qa_ludus_training_dialogue_browser.mjs
      - name: Verify Cloudflare serves identical clean backdrop and scripts
        shell: bash
        run: |
          python - <<'PY'
          import pathlib,hashlib,urllib.request,time
          origin='https://gladiator-arena-git.pages.dev'
          bg=pathlib.Path('public/assets/ludus/training_blank_v74.webp')
          expect=hashlib.sha256(bg.read_bytes()).hexdigest()
          expected_code=hashlib.sha256(pathlib.Path('public/ludus-approved-scenes.js').read_bytes()).hexdigest()
          expected_style=hashlib.sha256(pathlib.Path('public/ludus-training-clean.css').read_bytes()).hexdigest()
          expected_runtime=hashlib.sha256(pathlib.Path('public/ludus-training-runtime.js').read_bytes()).hexdigest()
          expected_risk=hashlib.sha256(pathlib.Path('public/ludus-training-risk.js').read_bytes()).hexdigest()
          for i in range(18):
              try:
                  headers={'User-Agent':'ArenaTrainerDialogueQA','Cache-Control':'no-cache'}
                  def fetch(path):
                      with urllib.request.urlopen(urllib.request.Request(origin+path,headers=headers),timeout=20) as r:
                          return r.read()
                  livebg=fetch('/assets/ludus/training_blank_v74.webp?painted-v74')
                  html=fetch('/?trainer-dialogue='+str(i)).decode('utf-8')
                  code_bytes=fetch('/ludus-approved-scenes.js?v=training-result-emblem-v73')
                  style_bytes=fetch('/ludus-training-clean.css?v=training-result-emblem-v73')
                  code=code_bytes.decode('utf-8')
                  style=style_bytes.decode('utf-8')
                  runtime_bytes=fetch('/ludus-training-runtime.js?v=innate-repetition-v72')
                  runtime=runtime_bytes.decode('utf-8')
                  risk_bytes=fetch('/ludus-training-risk.js?v=innate-repetition-v72')
                  if (hashlib.sha256(livebg).hexdigest()==expect and
                    'ludus-approved-scenes.js?v=training-result-emblem-v73' in html and
                    'ludus-training-clean.css?v=training-result-emblem-v73' in html and
                    hashlib.sha256(code_bytes).hexdigest()==expected_code and
                    hashlib.sha256(style_bytes).hexdigest()==expected_style and
                    hashlib.sha256(runtime_bytes).hexdigest()==expected_runtime and
                    hashlib.sha256(risk_bytes).hexdigest()==expected_risk and
                    'ludus-training-risk.js?v=innate-repetition-v72' in html and
                    'ludus-training-runtime.js?v=innate-repetition-v72' in html and
                    'training_blank_v74.webp' in code and
                    'DOCTORE_SCRIPT' in code and
                    'TRAINING_RESULT_MS=3200' in code and
                    'la-training-feedback' in code and
                    'la-speech-paper-restoration' not in code and
                    '.la-training-speech' in style and
                    'word-break:keep-all' in style and
                    'training_blank_v74.webp' in style and
                    'z-index:10!important' in style and
                    'height:131px' in style and
                    'laTrainingBadgeReveal' in style and
                    'PRACTICE_FOOT_Y=670' in runtime and
                    'PRACTICE_SCALE=0.70' in runtime):
                      print('LIVE_TRAINING_DIALOGUE_DEPLOYMENT_PASS');break
              except Exception as exc:
                  print('Waiting for Cloudflare',i,str(exc),flush=True)
              if i==17:raise AssertionError('Live training dialogue not yet deployed')
              time.sleep(10)
          PY
