name: Verify v126 live studio timeline auto-key release
on:
  push:
    branches: [main]
    paths:
      - docs/qa/studio-timeline-autokeys-v126.md
      - .github/workflows/qa-v126-cloudflare-studio.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cloudflare-studio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Cloudflare release marker AND live calibrator HTML SHA-256
        run: python scripts/spartacus_uploader.py verify --release-id spartacus-studio-timeline-autokeys-v126-20261028 --attempts 20
