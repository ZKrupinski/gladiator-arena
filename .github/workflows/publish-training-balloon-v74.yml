name: Publish corrected training balloon background v74
on:
  push:
    branches: [main]
    paths:
      - scripts/repair_training_balloon_background.py
      - .github/workflows/publish-training-balloon-v74.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: training-balloon-v74-publish
  cancel-in-progress: false
jobs:
  publish-background:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install Pillow==11.3.0
      - name: Edit only the baked left parchment face, keep scene unchanged
        run: python scripts/repair_training_balloon_background.py
      - name: Commit the actual corrected WebP binary to game assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/ludus/training_blank_v74.webp
          if ! git diff --cached --quiet; then
            git commit -m 'assets(training): publish corrected painted speech balloon v74'
            git push origin HEAD:main
          else
            echo 'Training v74 source image already committed'
          fi
