name: Verify v128 live enlarged sprite preview and start-pose ghost
on:
  push:
    branches: [main]
    paths:
      - docs/qa/studio-start-pose-ghost-v128.md
      - .github/workflows/qa-v128-cloudflare-studio.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cloudflare-ghost:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Cloudflare release marker and deployed editor file hash
        run: python scripts/spartacus_uploader.py verify --release-id spartacus-studio-start-pose-ghost-v128-20261028 --attempts 20
