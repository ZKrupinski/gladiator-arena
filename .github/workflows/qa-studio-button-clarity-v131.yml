name: QA studio button wording and action safety v131
on:
  push:
    branches: [main]
    paths:
      - public/tools/practice-scale-calibrator.html
      - scripts/qa_studio_button_clarity_browser.cjs
      - .github/workflows/qa-studio-button-clarity-v131.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  button-clarity:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser regression script syntax
        run: node --check scripts/qa_studio_button_clarity_browser.cjs
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test button intent, scopes, keyboard and mobile sizing
        run: node scripts/qa_studio_button_clarity_browser.cjs
