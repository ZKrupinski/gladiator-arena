name: SpriteForge V3 beast release safety
on:
  push:
    branches: [main]
    paths:
      - scripts/check_beast_release_v3.py
      - scripts/test_beast_release_gate_v3.py
      - config/beast-production-queue-v3.json
      - .github/workflows/qa-beast-release-v3.yml
  workflow_dispatch:
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pillow
      - name: Block absent, blurry, partial or unapproved art from production
        run: python scripts/test_beast_release_gate_v3.py
