name: Sprite Forge browser regression
on:
  push:
    branches: [main]
    paths:
      - public/sprite-forge.html
      - scripts/qa_sprite_forge_browser.mjs
      - .github/workflows/qa-sprite-forge.yml
  workflow_dispatch:
permissions:
  contents: read
  checks: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory public >/tmp/spriteforge-server.log 2>&1 &
          sleep 2
      - name: Verify eight-frame QA, clipping blockade, animated preview and local ZIP
        run: node scripts/qa_sprite_forge_browser.mjs
