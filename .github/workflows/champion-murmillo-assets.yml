name: Build champion Murmillo 72 frames
on:
  push:
    branches: [main]
    paths:
      - public/assets/combat/champion-murmillo/source/**
      - scripts/build_champion_murmillo.py
      - .github/workflows/champion-murmillo-assets.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sprites:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image toolkit
        run: python -m pip install --quiet Pillow numpy scipy
      - name: Split, cleanup and validate all source poses
        run: python scripts/build_champion_murmillo.py
      - name: Confirm 72 real images and no empty cuts
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from PIL import Image
          d=Path('public/assets/combat/champion-murmillo')
          m=json.loads((d/'manifest.json').read_text())
          assert len(m['actions'])==9 and sum(map(len,m['actions'].values()))==72
          for action,frames in m['actions'].items():
              assert len(frames)==8
              for spec in frames:
                  p=d/spec['file']
                  assert p.is_file()
                  with Image.open(p) as im:
                      assert im.size==(960,540)
                      assert im.getchannel('A').getbbox()
          print('PASS: 72 individual RGBA 960x540 frames')
          PY
      - name: Publish full-resolution art into GitHub main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/combat/champion-murmillo/frames public/assets/combat/champion-murmillo/manifest.json public/assets/combat/champion-murmillo/qa-contact.webp
          if ! git diff --cached --quiet; then
            git commit -m "assets(champion): publish 72 separated 16:9 transparent high detail poses"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
