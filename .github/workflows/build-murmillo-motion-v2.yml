name: Build Murmillo v2 independent sprites
on:
  push:
    branches: [main]
    paths:
      - scripts/build_murmillo_motion_v2.py
      - .github/workflows/build-murmillo-motion-v2.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet Pillow
      - name: Export independently cut source sprites
        run: python scripts/build_murmillo_motion_v2.py
      - name: Commit game-ready transparent resources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/combat/murmillo-v2/
          if ! git diff --cached --quiet; then
            git commit -m "assets(murmillo): publish 12 standalone transparent battle poses"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
