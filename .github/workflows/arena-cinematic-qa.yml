name: Arena cinematic focus and corpse retirement
on:
  push:
    branches: [main]
    paths:
      - public/index.html
      - public/arena-carnifex.js
      - public/arena-focus.js
      - scripts/qa_arena_focus_and_cleanup.mjs
      - scripts/qa_arena_focus_browser.mjs
      - scripts/qa_arena_impact_browser.mjs
      - .github/workflows/arena-cinematic-qa.yml
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify focus envelopes and corpse retirement
        run: node scripts/qa_arena_focus_and_cleanup.mjs
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Host game files
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory public > /tmp/arena-focus-server.log 2>&1 &
          sleep 3
      - name: Verify parry, dash impact and corpse removal in browser
        run: node scripts/qa_arena_focus_browser.mjs
      - name: Verify stronger zoom, slowdown, impacts and camera recovery
        env:
          FOCUS_PREVIEW: '1'
        run: node scripts/qa_arena_impact_browser.mjs
