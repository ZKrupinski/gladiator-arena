name: QA studio timeline auto key and marker sync v126
on:
  push:
    branches: [main]
    paths:
      - public/tools/practice-scale-calibrator.html
      - scripts/qa_studio_motion_scrub_browser.cjs
      - .github/workflows/qa-studio-motion-scrub-v126.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  motion-scrub:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify browser QA script syntax
        run: node --check scripts/qa_studio_motion_scrub_browser.cjs
      - name: Install Chromium for live editor interaction
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check scrub, auto keys, numeric X/Y and timeline marker clicks
        run: node scripts/qa_studio_motion_scrub_browser.cjs
