name: Verify Cloudflare directional VFX and stadium audio deployment
on:
  push:
    branches: [main]
    paths:
      - public/arena-raster-vfx.js
      - public/index.html
      - public/vfx-gallery.html
      - public/assets/new-era/directional-v4/**
      - public/arena-audio.js
      - public/assets/audio/rome-v1/**
      - scripts/verify_live_vfx.py
      - .github/workflows/qa-cloudflare-live-vfx.yml
  workflow_dispatch:
jobs:
  check-production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify live VFX frames and stadium audio match pushed commit
        run: python scripts/verify_live_vfx.py 17
