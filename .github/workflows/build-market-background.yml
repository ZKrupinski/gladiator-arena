name: Build clean market background

on:
  push:
    branches: [main]
    paths:
      - scripts/erase_market_merchant.py
      - .github/workflows/build-market-background.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean-keyvisual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare image tools
        run: python -m pip install --quiet numpy pillow opencv-python-headless
      - name: Erase baked merchant (keep source artwork intact)
        run: python scripts/erase_market_merchant.py
      - name: Commit new clean background asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/market/market_keyvisual_no_merchant.webp docs/qa/market-merchant-layout.webp
          if git diff --cached --quiet; then
            echo "Clean merchant background already up to date"
          else
            git commit -m "art(market): publish original-size merchant-free game background"
            git push origin HEAD:main
          fi
