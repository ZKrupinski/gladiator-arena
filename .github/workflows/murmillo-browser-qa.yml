name: Murmillo browser animation smoke test
on:
  push:
    branches: [main]
    paths:
      - public/murmillo-motion-v2.js
      - public/murmillo-motion-test.html
      - public/index.html
      - scripts/qa_murmillo_browser.mjs
      - .github/workflows/murmillo-browser-qa.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  animate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install headless browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Host exact deployable game files
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory public > /tmp/murmillo-server.log 2>&1 &
          sleep 3
          curl --fail http://127.0.0.1:8765/murmillo-motion-test.html > /dev/null
      - name: Prove pixels move in a real browser
        run: node scripts/qa_murmillo_browser.mjs
      - name: Commit browser verification captures
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/qa/murmillo-v3-*.png docs/qa/murmillo-v3-browser-report.json || true
          if ! git diff --cached --quiet; then
            git commit -m "qa(murmillo): record actual browser movement screenshots and timings"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
