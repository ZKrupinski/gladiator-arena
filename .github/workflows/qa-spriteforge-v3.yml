name: SpriteForge V3 generation quality gate
on:
  push:
    branches: [main]
    paths:
      - scripts/spriteforge_pipeline_v3.py
      - AGENTS.md
      - scripts/spriteforge_preflight_v3.py
      - scripts/spriteforge_assistant_brief_v3.py
      - scripts/test_spriteforge_assistant_brief_v3.py
      - scripts/mock_spriteforge_adapter_v3.py
      - scripts/spriteforge_auto_repair_v3.py
      - scripts/spriteforge_neighbor_ownership_v3.py
      - scripts/spriteforge_connected_mask_v6.py
      - scripts/spriteforge_preserve8_review.py
      - scripts/test_spriteforge_preserve8_review.py
      - scripts/test_spriteforge_connected_mask_v6.py
      - scripts/spartacus_wolf_import.py
      - tests/test_spartacus_wolf_import.py
      - scripts/audit_legacy_beasts_spriteforge_v3.py
      - scripts/build_beast_regeneration_queue_v3.py
      - scripts/test_spriteforge_pipeline_v3.py
      - scripts/test_spriteforge_auto_repair_v3.py
      - scripts/test_legacy_beasts_spriteforge_v3.py
      - scripts/test_beast_regeneration_queue_v3.py
      - .github/workflows/qa-spriteforge-v3.yml
      - config/spriteforge-qc-rules.json
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  spriteforge-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pillow numpy scipy
      - name: Verify ChatGPT assistant receives the latest SpriteForge briefing before drawing
        run: python scripts/test_spriteforge_assistant_brief_v3.py
      - name: Confirm creation briefing then enforce one-action native 4x2 sheet contract, handshake, alpha and seam QC
        run: python scripts/test_spriteforge_pipeline_v3.py
      - name: V6 full-sheet connected component owner extraction, no rectangular amputations
        run: python scripts/test_spriteforge_connected_mask_v6.py
      - name: Confirm all eight review slots survive ownership warnings without release bypass
        run: python scripts/test_spriteforge_preserve8_review.py
      - name: Real wolf import uses same connectivity source-of-truth
        run: python -m unittest discover -s tests -p test_spartacus_wolf_import.py
      - name: Test automatic fix / eight-frame regeneration / animated review
        run: python scripts/test_spriteforge_auto_repair_v3.py
      - name: Test neighboring-frame whole body deletion, preserving correct actor
        run: python scripts/test_legacy_beasts_spriteforge_v3.py
      - name: Ensure unresolved assets become regeneration jobs
        run: python scripts/test_beast_regeneration_queue_v3.py
