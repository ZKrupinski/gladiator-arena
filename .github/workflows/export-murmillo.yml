name: Export Murmillo original poses
on:
  push:
    branches: [main]
    paths: ['scripts/export_murmillo_originals.py','.github/workflows/export-murmillo.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet pillow
      - run: python scripts/export_murmillo_originals.py
      - name: Publish original keypose cutouts and review sheets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/qa/murmillo-original-reference/*.webp
          if ! git diff --cached --quiet; then
            git commit -m "art(qa): publish original Murmillo transparent keyposes, five growth tiers"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
