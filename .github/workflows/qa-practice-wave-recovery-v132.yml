name: QA practice wave auto continuation v132
on:
  push:
    branches: [main]
    paths:
      - public/ludus-practice.js
      - scripts/qa_practice_wave_recovery_browser.cjs
      - .github/workflows/qa-practice-wave-recovery-v132.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-stuck-waves:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check public/ludus-practice.js
          node --check scripts/qa_practice_wave_recovery_browser.cjs
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Reproduce stalled corpse, queued replacement and one-frame renderer fault
        run: node scripts/qa_practice_wave_recovery_browser.cjs
