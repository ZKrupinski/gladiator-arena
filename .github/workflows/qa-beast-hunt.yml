name: VENATIO dedicated beast hunt validation
on:
  push:
    branches: [main]
    paths:
      - public/index.html
      - public/ludus-scene.js
      - public/arena-beasts.js
      - public/beast-hunt.css
      - scripts/qa_beast_hunt_browser.mjs
      - .github/workflows/qa-beast-hunt.yml
  workflow_dispatch:
jobs:
  venatio:
    permissions:
      contents: read
      checks: read
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory public >/tmp/game.log 2>&1 &
          sleep 2
      - name: Test stage cards, combat, earned gold, animal art
        run: node scripts/qa_beast_hunt_browser.mjs
      # Cloudflare WAF blocks GitHub-hosted runners from requesting the site
      # directly (HTTP 403), even after Pages successfully deploys it. The
      # Cloudflare Pages check is published by Cloudflare against THIS SHA.
      - name: Verify Cloudflare Pages deployment check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,time,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']
          sha=os.environ['GITHUB_SHA']
          target=f'https://api.github.com/repos/{repo}/commits/{sha}/check-runs?per_page=100'
          for attempt in range(30):
              req=urllib.request.Request(target,headers={
                  'Accept':'application/vnd.github+json',
                  'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                  'X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req,timeout=18) as response:
                  runs=json.load(response).get('check_runs',[])
              pages=[x for x in runs if x.get('name')=='Cloudflare Pages']
              if pages and pages[0].get('status')=='completed':
                  if pages[0].get('conclusion')!='success':
                      raise RuntimeError('Cloudflare Pages check failed: '+str(pages[0].get('conclusion')))
                  print('VENATIO_PAGES_DEPLOYED',sha,pages[0].get('details_url'))
                  break
              print('Waiting for Cloudflare Pages check',attempt+1,flush=True)
              if attempt==29:raise RuntimeError('Timed out waiting for Cloudflare Pages deployment')
              time.sleep(8)
          PY
